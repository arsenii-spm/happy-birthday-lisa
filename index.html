<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf8f3" />
  <title>26.11.2010 — С днём рождения, Лиза</title>
  <meta name="description" content="Открытка ко дню рождения — 26.11.2010." />

  <!-- Editorial Typography (Cyrillic supported) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Subtle paper grain overlay -->
  <div class="paper-grain" aria-hidden="true"></div>

  <main class="page">
    <!-- Top Masthead -->
    <header class="masthead">
      <div class="masthead__meta">
        <span id="birth-date-badge">26.11.2010</span>
        <span class="masthead__dot" aria-hidden="true">·</span>
        <span id="age-badge">16 ЛЕТ</span>
      </div>
      <div class="masthead__issue" id="celebration-date-badge">26.11.2026</div>
    </header>

    <!-- Block 1: Cover / Hero -->
    <section class="hero reveal">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 class="hero__title">
        <span id="hero-title"></span>,
        <em class="hero__name" id="recipient-name"></em>
      </h1>
      <p class="hero__lead" id="hero-lead"></p>
    </section>

    <hr class="editorial-rule" />

    <!-- Block 2: Personal Letter -->
    <section class="letter reveal" aria-labelledby="letter-title">
      <h2 class="section-title" id="letter-title"></h2>
      <div class="letter__body" id="letter-body"></div>
      <p class="letter__signature" id="sender-name"></p>
    </section>

    <!-- Block 3: Light Paper Note -->
    <aside class="paper-note reveal" aria-labelledby="note-title">
      <h3 class="paper-note__title" id="note-title"></h3>
      <ol class="paper-note__list" id="wishes-list"></ol>
    </aside>

    <hr class="editorial-rule" />

    <!-- Block 4: Two-Gift Widget -->
    <section class="gifts-section reveal" aria-labelledby="gifts-title">
      <div class="gifts-section__header">
        <h2 class="section-title" id="gifts-title"></h2>
        <p class="gifts-section__subtitle" id="gifts-subtitle"></p>
      </div>

      <div class="gifts-grid">
        <!-- Gift 1: Gray / Locked -->
        <button
          type="button"
          class="gift-card gift-card--locked"
          id="locked-gift-card"
          aria-describedby="locked-gift-status"
        >
          <div class="gift-card__top">
            <span class="gift-badge gift-badge--muted" id="locked-gift-badge"></span>
            <span class="gift-icon gift-icon--lock" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="11" width="16" height="9" rx="2"></rect>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
              </svg>
            </span>
          </div>

          <div class="gift-card__content">
            <h3 class="gift-card__title" id="locked-gift-title"></h3>
            <p class="gift-card__status" id="locked-gift-status"></p>
          </div>

          <div class="gift-card__footer">
            <span class="gift-card__hint" id="locked-gift-hint"></span>
          </div>
        </button>

        <!-- Gift 2: From Mom (Opens Modal) -->
        <button
          type="button"
          class="gift-card gift-card--active"
          id="mom-gift-card"
          aria-haspopup="dialog"
          aria-controls="gift-modal"
        >
          <div class="gift-card__top">
            <span class="gift-badge gift-badge--ink" id="mom-gift-badge"></span>
          </div>

          <div class="gift-card__content">
            <h3 class="gift-card__title" id="mom-gift-title"></h3>
            <p class="gift-card__subtitle" id="mom-gift-subtitle"></p>
          </div>

          <div class="gift-card__footer">
            <span class="gift-card__cta" id="mom-gift-cta"></span>
            <span class="gift-card__arrow" aria-hidden="true">→</span>
          </div>
        </button>
      </div>
    </section>

    <footer class="footer">
      <span>26.11.2010 — 26.11.2026</span>
    </footer>
  </main>

  <!-- Modal: Card from Mom + Gold Apple Certificate -->
  <div
    class="modal-backdrop"
    id="gift-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    hidden
  >
    <div class="modal-card">
      <button
        type="button"
        class="modal-close"
        id="modal-close-btn"
        aria-label="Закрыть окно"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M18 6L6 18M6 6l12 12"></path>
        </svg>
      </button>

      <div class="modal-letter">
        <p class="eyebrow" id="modal-eyebrow"></p>
        <h2 class="modal-letter__title" id="modal-title"></h2>
        <p class="modal-letter__text" id="modal-message"></p>
        <p class="modal-letter__signature" id="modal-signature"></p>
      </div>

      <div class="certificate-box">
        <div class="certificate-box__header">
          <div class="certificate-brand">
            <img
              src="assets/gold-apple-logo.svg"
              alt="Логотип Золотое Яблоко"
              class="certificate-brand__logo"
              width="42"
              height="42"
            />
            <div>
              <p class="certificate-brand__name" id="cert-brand-name"></p>
              <p class="certificate-brand__type" id="cert-type"></p>
            </div>
          </div>
          <span class="certificate-tag">GIFT CARD</span>
        </div>

        <p class="certificate-box__note" id="cert-note"></p>

        <div class="certificate-actions">
          <button type="button" class="btn btn--primary" id="toggle-email-btn">
            Отправить сертификат
          </button>
        </div>

        <!-- Inline Email Form (revealed on "Отправить сертификат" click) -->
        <form class="email-form" id="email-form" hidden novalidate>
          <label for="recipient-email" class="email-form__label">
            Почта, на которую отправится сертификат
          </label>
          <div class="email-form__row">
            <input
              type="email"
              id="recipient-email"
              name="email"
              class="email-form__input"
              placeholder="name@example.com"
              autocomplete="email"
              required
            />
            <button type="submit" class="btn btn--accent" id="send-email-submit">
              Отправить
            </button>
          </div>
          <p class="email-form__feedback" id="email-feedback" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </div>

  <!-- EmailJS Browser SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
